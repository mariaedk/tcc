<div class="card p-4 chart-custom">
  <div class="d-flex justify-content-between align-items-start">
    <div>
      <h5 class="mb-2">Análise do Histórico de Vazão Diária - ETA 2 ({{ unidadeMedida }})</h5>
      <p class="mb-3">Pontos em vermelho indicam comportamentos fora do padrão.</p>
    </div>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary" (click)="exportarAnomaliaXls()">
        <i class="bi bi-file-earmark-spreadsheet"></i> Exportar XLS
      </button>
    </div>
  </div>

  <div *ngIf="chartVazio" class="alerta-vazio">
    Nenhum dado encontrado para o período selecionado.
  </div>

  <div *ngIf="!chartVazio" echarts [options]="chartOption" style="height: 350px;"></div>

  <div class="mt-2 small">
    <span style="color: #0077b6;">🔵</span> Valor normal &nbsp;&nbsp;
    <span style="color: #dc3545;">🔴</span> Anomalia detectada
  </div>
</div>
